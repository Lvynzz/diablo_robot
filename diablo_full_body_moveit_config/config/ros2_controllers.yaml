# Controllers shared by the mock description and the real Diablo hardware
# description.  The xacro selects the mock or real ros2_control systems.
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diablo_base_controller:
      type: diff_drive_controller/DiffDriveController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

diablo_base_controller:
  ros__parameters:
    left_wheel_names:
      - left_wheel_joint
    right_wheel_names:
      - right_wheel_joint
    wheel_separation: 0.3751
    wheel_radius: 0.105
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: diablo_base_link
    enable_odom_tf: true
    open_loop: false
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    velocity_rolling_window_size: 2
    publish_limited_velocity: true
    pose_covariance_diagonal: [0.001, 0.001, 0.01, 0.0, 0.0, 0.05]
    twist_covariance_diagonal: [0.001, 0.001, 0.01, 0.0, 0.0, 0.05]

left_arm_controller:
  ros__parameters:
    joints:
      - upper_left_shoulder_pitch_joint
      - upper_left_shoulder_roll_joint
      - upper_left_elbow_joint
      - upper_left_wrist_joint
      - upper_left_thumb_base
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

right_arm_controller:
  ros__parameters:
    joints:
      - upper_right_shoulder_pitch_joint
      - upper_right_shoulder_roll_joint
      - upper_right_elbow_joint
      - upper_right_wrist_joint
      - upper_right_thumb_base
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
