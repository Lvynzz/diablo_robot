# ============================================================
# Diablo EKF — wheel x/y odometry + IMU yaw heading
# Robot  : Diablo crawl base
# IMU    : Diablo onboard IMU
# Distro : ROS 2 Humble
# ============================================================

diablo_ekf_filter:
  ros__parameters:

    # --- Frekuensi & timeout ---
    frequency: 20.0           # frekuensi moderat untuk telemetry Diablo
    sensor_timeout: 0.1
    two_d_mode: true          # Diablo crawl di lantai → 2D

    # --- Frame ---
    odom_frame:      odom
    base_link_frame: diablo_base_link
    world_frame:     odom

    print_diagnostics: true

    publish_tf: true
    predict_to_current_time: true

    # ============================================================
    # Sumber 1: Odometri roda Diablo
    # Encoder hanya mengurus posisi x/y dan kecepatan maju. Yaw pose serta yaw
    # rate roda sengaja tidak difuse; heading tunggal filter berasal dari IMU.
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # ============================================================
    odom0: /diablo_base_controller/odom
    odom0_config: [
      true,  true,  false,
      false, false, false,
      true,  false, false,
      false, false, false,
      false, false, false
    ]
    # Convert encoder x/y samples to increments so a SetPose reset does not
    # get pulled back to the encoder's old absolute origin.
    odom0_differential: true
    odom0_relative: false
    odom0_queue_size: 10
    odom0_nodelay: true

    # ============================================================
    # Sumber 2: IMU onboard Diablo (/diablo/sensor/Imu)
    # Pakai quaternion yaw hasil internal IMU sebagai satu-satunya sumber
    # orientasi. Gyro Z tidak difuse terpisah agar heading tidak dihitung dua
    # kali dari IMU yang sama. imu0_relative membuat heading awal menjadi nol.
    # ============================================================
    imu0: /diablo/sensor/Imu
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 100
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: false

    # ============================================================
    # Process Noise Covariance (Q) — Diablo crawl base bergerak di lantai
