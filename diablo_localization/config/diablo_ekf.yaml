# Local planar estimator for Diablo.
#
# The filter intentionally consumes wheel/IMU rates instead of absolute wheel
# pose or absolute IMU orientation.  This makes the EKF origin explicit and
# allows /diablo/reset_pose to remain effective while the robot keeps running.
# It also means that an external localizer (AMCL/SLAM) can later correct the
# map -> odom transform without fighting this filter.

diablo_ekf_filter:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.15
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false
    predict_to_current_time: true
    dynamic_process_noise_covariance: true

    # Lightweight relative-odometry profile.  The filter currently receives
    # wheel/IMU rates only, so these values keep the covariance bounded enough
    # for short goal-navigation tests.  They do not make wheel odometry
    # globally accurate, and should be retuned if an absolute sensor is added.
    # Values are diagonal entries in the state order documented below.
    process_noise_covariance: [1.0e-4, 1.0e-4, 1.0e-4,
                               1.0e-4, 1.0e-4, 2.0e-4,
                               1.0e-3, 1.0e-3, 1.0e-3,
                               1.0e-3, 1.0e-3, 2.0e-3,
                               1.0e-3, 1.0e-3, 1.0e-3]
    initial_estimate_covariance: [1.0e-6, 1.0e-6, 1.0e-6,
                                  1.0e-6, 1.0e-6, 1.0e-6,
                                  1.0e-4, 1.0e-4, 1.0e-4,
                                  1.0e-4, 1.0e-4, 1.0e-4,
                                  1.0e-4, 1.0e-4, 1.0e-4]

    map_frame: map
    odom_frame: odom
    base_link_frame: diablo_base_link
    world_frame: odom

    # nav_msgs/Odometry config order:
    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    # Use wheel forward/yaw rates; do not fuse the duplicate wheel pose.
    odom0: /diablo_base_controller/odom
    odom0_config: [false, false, false, false, false, false,
                   true, false, false, false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # Use only IMU gyro Z.  The absolute quaternion is not fused here because
    # its startup/reference heading is driver-defined; gyro integration keeps
    # the EKF resettable to any operator-selected heading.
    imu0: /diablo/sensor/Imu
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
