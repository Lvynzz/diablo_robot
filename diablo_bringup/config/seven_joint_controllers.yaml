controller_manager:
  ros__parameters:
    # Arti: frekuensi loop controller manager (Hz). Dampak: naik lebih responsif
    # tetapi CPU/bus naik. Kisaran praktis: 30-200 Hz.
    update_rate: 30

    # Arti: broadcaster state posisi/kecepatan joint ke ROS. Kisaran: plugin terinstal.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Arti: controller trajectory untuk tujuh joint. Kisaran: plugin terinstal.
    seven_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Konfigurasi khusus untuk trajectory controller
seven_joint_trajectory_controller:
  ros__parameters:
    # Arti: daftar joint dan urutan indeks trajectory. Dampak: order salah dapat
    # menggerakkan joint berbeda. Kisaran: nama joint valid di URDF.
    joints:
      - joint1  # ID 1
      - joint2  # ID 2
      - joint3  # ID 3
      - joint6  # ID 6
      - joint7  # ID 7
      - joint8  # ID 8
      - joint11 # ID 11
    
    # Arti: interface command ke hardware. Dampak: position mengirim target sudut.
    # Kisaran: interface yang diekspor hardware.
    command_interfaces:
      - position
    # Arti: interface state yang dibaca dari hardware. Dampak: dipakai publisher
    # state/feedback. Kisaran: interface hardware yang tersedia.
    state_interfaces:
      - position
