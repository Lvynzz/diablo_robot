controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint23_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint23_trajectory_controller:
  ros__parameters:
    joints:
      - joint2
      - joint3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    # Teleop mengirim kedua joint setiap kali. Ini membuat slot "x" tetap
    # mempertahankan posisi feedback terakhir tanpa partial-goal ambiguity.
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      # Beri waktu servo Dynamixel untuk settle setelah trajectory selesai.
      goal_time: 2.5
      joint2:
        trajectory: 0.3
        goal: 0.05
      joint3:
        trajectory: 0.3
        goal: 0.05
