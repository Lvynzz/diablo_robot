slam_toolbox:
  ros__parameters:
    # Tuning guide: “Kisaran” di bawah adalah kisaran praktis, bukan batas
    # keras. Satuan penting: jarak dalam meter, sudut dalam radian, waktu dalam
    # detik, dan stack_size_to_use dalam byte. Ubah satu kelompok lalu cek
    # kualitas /map, /tf, dan beban CPU sebelum melanjutkan.
    # Arti: gunakan /clock simulasi. Dampak: true tanpa /clock membuat SLAM
    # menunggu waktu; robot nyata gunakan false. Kisaran: false/true.
    use_sim_time: false
    # Arti: backend optimisasi pose-graph. Dampak: Ceres umumnya stabil tetapi
    # memakai CPU/memori; g2o bisa lebih ringan bila plugin tersedia. Kisaran:
    # solver_plugins::CeresSolver atau plugin solver yang terinstal.
    solver_plugin: solver_plugins::CeresSolver
    # Arti: algoritma penyelesaian sistem linear Ceres. Dampak: sparse solver
    # efisien untuk peta besar; pilihan lain mengubah CPU/memori. Kisaran: enum
    # Ceres yang tersedia (SPARSE_NORMAL_CHOLESKY umum untuk Diablo).
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    # Arti: preconditioner sistem linear. Dampak: memengaruhi kecepatan/konvergensi;
    # SCHUR_JACOBI umumnya seimbang. Kisaran: enum Ceres valid.
    ceres_preconditioner: SCHUR_JACOBI
    # Arti: strategi trust-region. Dampak: LEVENBERG_MARQUARDT lebih konservatif
    # dan stabil; DOGLEG dapat lebih cepat pada kasus tertentu. Kisaran: enum valid.
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    # Arti: varian dogleg bila strategi DOGLEG dipakai. Dampak: hanya relevan
    # untuk strategi tersebut. Kisaran: TRADITIONAL_DOGLEG atau enum valid.
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # Arti: robust loss untuk outlier scan/constraint. Dampak: loss non-None
    # mengurangi pengaruh outlier; None mempertahankan bobot penuh. Kisaran:
    # None atau fungsi loss Ceres yang didukung.
    ceres_loss_function: None
    # Arti: mode SLAM. Dampak: mapping membuat peta baru; localization memakai
    # pose-graph/peta yang ada (tergantung launch). Kisaran: mapping, localization,
    # atau mode lain yang disediakan versi slam_toolbox.
    mode: mapping
    # Arti: nama frame peta. Dampak: harus cocok dengan map_server/Nav2.
    # Kisaran: nama frame, biasanya map.
    map_frame: map
    # Arti: frame odometri. Dampak: harus cocok dengan TF odom->base.
    # Kisaran: nama frame, biasanya odom.
    odom_frame: odom
    # Arti: frame badan robot. Dampak: salah frame memutus transform scan.
    # Kisaran: nama frame, biasanya diablo_base_link.
    base_frame: diablo_base_link
    # Arti: topic LaserScan. Dampak: topic salah membuat peta tidak bergerak.
    # Kisaran: nama topic ROS, biasanya /scan.
    scan_topic: /scan
    # Arti: resolusi peta (m/cell). Dampak: lebih kecil menangkap detail tetapi
    # CPU/memori dan ukuran file naik. Kisaran praktis: 0.02-0.10 m; samakan
    # dengan resolusi map yang ingin dipakai AMCL.
    resolution: 0.05
    # Arti: jarak maksimum lidar yang dipakai (m). Dampak: lebih jauh memberi
    # fitur lebih banyak tetapi noise/CPU naik. Kisaran: 5-30 m, <= sensor.
    max_laser_range: 12.0
    # Arti: waktu minimum antar pemrosesan scan (s). Dampak: lebih kecil peta
    # lebih cepat/detail dengan CPU tinggi; lebih besar menghemat CPU. Kisaran: 0.05-0.5 s.
    minimum_time_interval: 0.1
    # Arti: batas tunggu lookup TF (s). Dampak: lebih besar tahan jitter jaringan
    # tetapi dapat memakai transform basi. Kisaran praktis: 0.05-1 s.
    transform_timeout: 0.2
    # Arti: lama riwayat TF yang disimpan (s). Dampak: lebih besar tahan jeda
    # sensor/loop closure tetapi memori naik. Kisaran praktis: 5-120 s.
    tf_buffer_duration: 30.0
    # Arti: ukuran stack thread solver (byte; 40,000,000 = 40 MB). Dampak: lebih
    # besar mencegah stack overflow pada graph besar tetapi memori naik. Kisaran
    # praktis: 10-100 MB (10,000,000-100,000,000).
    stack_size_to_use: 40000000
    # Arti: jarak minimum robot bergerak sebelum scan baru diproses (m). Dampak:
    # lebih besar mengurangi CPU tetapi detail saat gerak pelan berkurang.
    # Kisaran praktis: 0.02-0.20 m.
    minimum_travel_distance: 0.05
    # Arti: perubahan heading minimum sebelum scan diproses (rad). Dampak: lebih
    # besar menghemat CPU namun sudut kecil tidak memperkaya peta. Kisaran: 0.02-0.30 rad.
    minimum_travel_heading: 0.05
    # Arti: aktifkan scan matching terhadap scan sebelumnya. Dampak: true biasanya
    # memperbaiki odom, tetapi CPU naik; false lebih mengandalkan odom. Kisaran false/true.
    use_scan_matching: true
    # Arti: gunakan barycenter scan sebagai fitur tambahan. Dampak: dapat membantu
    # koridor/scan jarang, tetapi bisa bias pada outlier. Kisaran: false/true.
    use_scan_barycenter: true
    # Arti: tutup loop untuk mengoreksi drift saat kembali ke tempat lama. Dampak:
    # true memperbaiki peta global namun CPU/risiko koreksi besar naik. Kisaran false/true.
    do_loop_closing: true
    # Arti: interval update peta terbit (s). Dampak: lebih kecil UI/peta lebih
    # segar dengan CPU/I/O naik. Kisaran praktis: 0.5-20 s.
    map_update_interval: 5.0
    # Arti: izinkan kontrol interaktif slam_toolbox (RViz/services). Dampak: false
    # mengurangi overhead dan mencegah perubahan manual. Kisaran: false/true.
    enable_interactive_mode: true
