trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.02
  trajectory_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller

  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - upper_left_shoulder_pitch_joint
      - upper_left_shoulder_roll_joint
      - upper_left_elbow_joint
      - upper_left_wrist_joint
      - upper_left_thumb_base

  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: false
    joints:
      - upper_right_shoulder_pitch_joint
      - upper_right_shoulder_roll_joint
      - upper_right_elbow_joint
      - upper_right_wrist_joint
      - upper_right_thumb_base
